# Site KoudMain : Apache sert le dossier public/ de Laravel. Le port est celui de la variable PORT (voir Dockerfile).
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:${PORT}>
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    # Render termine le HTTPS devant le conteneur et l'indique dans X-Forwarded-Proto. On le transmet à PHP (HTTPS=on) :
    # l'application sait qu'elle est en HTTPS même avant TrustProxies, ce qui évite toute boucle de redirection.
    SetEnvIf X-Forwarded-Proto "^https" HTTPS=on

    <Directory ${APACHE_DOCUMENT_ROOT}>
        # AllowOverride All : public/.htaccess réécrit les adresses vers index.php et règle le cache des fichiers statiques.
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # Règle 11 : une requête de plus de 13 Mo est refusée (413) par Apache lui-même, avant d'occuper PHP. PHP applique ensuite
    # sa propre limite (post_max_size = 12M, 5 Mo par image).
    LimitRequestBody 13631488

    # Règle 12 : le dossier des envois (mode local) ne sert QUE des images. Même si un fichier PHP y arrivait par une faille,
    # il ne serait ni exécuté ni servi. (Les photos sont en plus redessinées et renommées par le serveur : voir ImageProcessor.)
    <Directory ${APACHE_DOCUMENT_ROOT}/uploads>
        Options -Indexes -ExecCGI
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|pl|py|cgi|sh|htaccess)$">
            Require all denied
        </FilesMatch>
        <IfModule mod_headers.c>
            Header set X-Content-Type-Options "nosniff"
            Header set Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
        </IfModule>
    </Directory>

    # Jamais servis, même par erreur : fichiers cachés (.env, .git...) et sauvegardes.
    <FilesMatch "^\.(?!well-known)">
        Require all denied
    </FilesMatch>

    # L'identifiant que l'application donne à chaque requête (en-tête de réponse X-Request-Id) figure dans le journal d'accès :
    # une ligne Apache se relie ainsi aux lignes du journal de l'application (« requete »).
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" rid=%{X-Request-Id}o" koudmain
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 koudmain
</VirtualHost>
