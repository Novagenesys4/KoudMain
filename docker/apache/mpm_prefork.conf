# Nombre de processus Apache. Chacun garde UNE connexion ouverte vers la base (DB_PERSISTENT=true) : ce nombre est donc aussi
# le nombre maximal de connexions que l'application ouvre vers Supabase (le « session pooler » en accepte peu sur l'offre gratuite).
# À augmenter avec APACHE_MAX_WORKERS seulement si la base peut suivre.
<IfModule mpm_prefork_module>
    StartServers             3
    MinSpareServers          2
    MaxSpareServers          5
    MaxRequestWorkers        ${APACHE_MAX_WORKERS}
    ServerLimit              ${APACHE_MAX_WORKERS}
    # Un processus est renouvelé de temps en temps (fuites mémoire éventuelles), sans jamais couper une requête en cours.
    MaxConnectionsPerChild   2000
</IfModule>
