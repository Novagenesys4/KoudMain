; Réglages PHP de production pour KoudMain.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 256M
; Photos : 5 Mo maximum par image (koudmain.media.envoi_max_ko), marge pour le formulaire.
upload_max_filesize = 6M
post_max_size = 12M
; Au plus 8 fichiers par requête (6 photos de prestation + marge) : plafonne le travail d'une seule requête.
max_file_uploads = 8
; Ni URL distantes ouvertes comme des fichiers, ni inclusion distante : aucun besoin dans l'application.
allow_url_include = Off
; Le flux temps réel (SSE) reste ouvert ~25 s : la limite doit être plus large.
max_execution_time = 60
date.timezone = Africa/Abidjan

; Opcache : l'image ne change jamais une fois construite, PHP n'a donc pas à revérifier les fichiers.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Sessions : un cookie inaccessible à JavaScript, jamais envoyé en HTTP clair (Laravel gère aussi les siens).
session.cookie_httponly = 1
session.use_strict_mode = 1
