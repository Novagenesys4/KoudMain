# Sécurité (SECURITE.md, règles 2 et 18) : secrets dans tout l'historique Git, failles connues des dépendances, tests.
# Tourne à chaque envoi, à chaque demande de fusion, et chaque lundi (failles publiées sans changement de code).
name: Sécurité

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tout l'historique : un secret supprimé reste dans les anciens commits
      - name: Installer gitleaks (empreinte vérifiée)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
      - name: Scanner tout l'historique
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .

  dependances:
    name: Dépendances (failles connues)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: composer audit
        run: composer audit --locked
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: koudmain_test
          POSTGRES_USER: koudmain
          POSTGRES_PASSWORD: koudmain_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U koudmain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, gd, intl
          tools: composer
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
